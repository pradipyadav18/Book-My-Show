spring.application.name=BMS
server.port=8080

# --- Datasource (override via env in prod) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/BMS}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5

# --- JPA: validate, migrations own the schema ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Flyway owns DDL ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Dev seed only (never in prod) ---
spring.sql.init.mode=never

# --- CORS allowlist (comma-separated) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- JWT (set APP_JWT_SECRET env in prod, >=32 bytes) ---
app.jwt.secret=${APP_JWT_SECRET:change-me-to-64-char-secret-please-change-me-0123456789abcdef}
app.jwt.expiration-ms=900000

# --- Observability ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
